[package]
name = "buffer_box"
version = "0.1.1"
edition = "2024"

[dependencies]
arboard = "3.6.1"
clap = { version = "4.6.1", features = ["derive"] }
clipboard-files = "0.1.2"
image = "0.25.10"
inquire = "0.9.4"
rand = "0.10.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true