stages:
  - test       # Новая стадия для тестов
  - build
  - release

# Глобальный кэш для Cargo, чтобы ускорить скачивание и компиляцию зависимостей
cache:
  key: "${CI_COMMIT_REF_SLUG}-${TARGET}"
  paths:
    - .cargo/registry/cache/
    - .cargo/git/db/
    - target/

# --- СТАДИЯ ТЕСТИРОВАНИЯ ---
run_tests:
  stage: test
  image: rust:latest
  variables:
    CARGO_HOME: $CI_PROJECT_DIR/.cargo
  before_script:
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain nightly-2026-01-19
    - source $CARGO_HOME/env
  script:
    - echo "Running cargo test..."
    - cargo test --workspace --verbose
  rules:
    # Тесты запускаются всегда: при пуше в любую ветку, при пуше тегов и ручном запуске
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG =~ /^v.*/'
    - if: '$CI_PIPELINE_SOURCE == "web"'

# --- ШАБЛОН ДЛЯ СБОРКИ ---
.build_template:
  stage: build
  variables:
    CARGO_HOME: $CI_PROJECT_DIR/.cargo
  needs:
    - run_tests # ВАЖНО: сборка начнется только ПОСЛЕ успешного прохождения тестов
  before_script:
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain nightly-2026-01-19
    - source $CARGO_HOME/env
    - rustup target add $TARGET
  script:
    - |
      if [ "$USE_CROSS" = "true" ]; then
        cargo install cross --git https://github.com/cross-rs/cross
        cross build --release --target $TARGET
      else
        cargo build --release --target $TARGET
      fi
    - cd target/$TARGET/release
    - BINARY_NAME="buffer_box"
    - RELEASE_NAME="$BINARY_NAME-$TARGET"
    - |
      if [[ "$TARGET" == *"windows"* ]]; then
        apt-get update && apt-get install -y zip
        zip "../../../$RELEASE_NAME.zip" "$BINARY_NAME.exe"
      else
        tar -czf "../../../$RELEASE_NAME.tar.gz" "$BINARY_NAME"
      fi
    - cd ../../../
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v.*/'
    - if: '$CI_PIPELINE_SOURCE == "web"'

# --- СБОРКА ПОД LINUX И WINDOWS ---
build_linux_windows:
  extends: .build_template
  image: rust:latest
  tags:
    - docker
  parallel:
    matrix:
      - TARGET: x86_64-unknown-linux-gnu
        USE_CROSS: "true"
      - TARGET: aarch64-unknown-linux-gnu
        USE_CROSS: "true"
      - TARGET: x86_64-pc-windows-msvc
        USE_CROSS: "false"
  artifacts:
    paths:
      - buffer_box-*
    expire_in: 2 days

# --- СБОРКА ПОД MACOS ---
build_macos:
  extends: .build_template
  tags:
    - macos
  parallel:
    matrix:
      - TARGET: x86_64-apple-darwin
        USE_CROSS: "false"
      - TARGET: aarch64-apple-darwin
        USE_CROSS: "false"
  artifacts:
    paths:
      - buffer_box-*
    expire_in: 2 days

# --- СОЗДАНИЕ РЕЛИЗА И ЗАГРУЗКА ФАЙЛОВ ---
upload_release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - build_linux_windows
    - build_macos
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v.*/'
  script:
    - echo "Creating release for $CI_COMMIT_TAG"
  release:
    name: 'Release $CI_COMMIT_TAG'
    description: 'Created automatically by GitLab CI/CD. Build notes generated from commits.'
    tag_name: '$CI_COMMIT_TAG'
    assets:
      links:
        - name: "Linux x86_64"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/buffer_box-x86_64-unknown-linux-gnu.tar.gz?job=build_linux_windows"
        - name: "Linux ARM64"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/buffer_box-aarch64-unknown-linux-gnu.tar.gz?job=build_linux_windows"
        - name: "Windows x64"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/buffer_box-x86_64-pc-windows-msvc.zip?job=build_linux_windows"
        - name: "macOS Intel"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/buffer_box-x86_64-apple-darwin.tar.gz?job=build_macos"
        - name: "macOS Apple Silicon"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/buffer_box-aarch64-apple-darwin.tar.gz?job=build_macos"