name: Build and Release

on:
  push:
    tags:
      - 'v*' # Запуск при пуше тегов вроде v1.0.0

jobs:
  release:
    name: Build for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux 64-bit
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use-cross: true
          
          # Linux ARM64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use-cross: true

          # Windows 64-bit
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use-cross: false

          # macOS Intel
          - target: x86_64-apple-darwin
            os: macos-latest
            use-cross: false

          # macOS Apple Silicon (M1/M2/M3/M4)
          - target: aarch64-apple-darwin
            os: macos-latest
            use-cross: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-01-19
          targets: ${{ matrix.target }}

      - name: Cache Cargo Registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Cross
        if: matrix.use-cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build Release Binary
        run: |
          if [ "${{ matrix.use-cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Package Artifacts
        run: |
          cd target/${{ matrix.target }}/release
          
          BINARY_NAME="buffer_box" 
          RELEASE_NAME="$BINARY_NAME-${{ matrix.target }}"
          
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            powershell Compress-Archive -Path "$BINARY_NAME.exe" -DestinationPath "../../../$RELEASE_NAME.zip"
          else
            tar -czf "../../../$RELEASE_NAME.tar.gz" "${BINARY_NAME}"
          fi
        shell: bash

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            buffer_box-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}